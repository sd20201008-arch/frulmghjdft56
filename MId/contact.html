<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bad Bunny Fan Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Fixed Positioning: Back to Top Button -->
    <a href="#top" class="back-to-top" aria-label="Back to top">↑</a>

    <header class="main-header sticky-top" id="top">
        <div class="logo"><h2>Bad Bunny</h2></div>
        <button class="burger-menu" id="burger-menu" aria-label="Toggle navigation">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="tour.html">Tour Schedule</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="main-content-container py-4">
        <div class="container">
            <section id="contact-form-section" class="section-block border-0">
                <h2 class="section-title">Join Fan Club / Contact Us</h2>
                <form action="#" method="POST" class="col-md-8 mx-auto">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Full Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label fw-semibold">Message / Fan Note</label>
                        <textarea id="message" class="form-control" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </section>
        </div>
    </main>

    <!-- Footer with Contact Info & Social Links -->
    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy;SE-2540: Darkhan, Danial, Askar</p>
            <p class="footer-contact">Email: <a href="darhanserikbaj3@gmail.com"></a>darhanserikbaj3@gmail.com</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('burger-menu').addEventListener('click', () => {
            document.getElementById('burger-menu').classList.toggle('active');
            document.getElementById('nav-links').classList.toggle('active');
        });
    </script>
</body>
</html>
